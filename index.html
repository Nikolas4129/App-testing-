<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Notes & AI Summarizer</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --danger: #ef4444;
      --success: #22c55e;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
    .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 16px; }
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    h1 { font-size: 1.1rem; font-weight: 700; }
    .badge { font-size: 0.75rem; padding: 4px 8px; border-radius: 12px; background: var(--border); color: var(--muted); }
    .badge.active { background: #7f1d1d; color: #fca5a5; animation: blink 1.5s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .controls { display: flex; gap: 10px; }
    button { flex: 1; padding: 14px; border: none; border-radius: 8px; font-weight: 600; font-size: 0.95rem; cursor: pointer; color: white; display: flex; justify-content: center; align-items: center; gap: 8px; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-start { background: var(--success); }
    .btn-stop { background: var(--danger); }
    .btn-action { background: var(--accent); color: #0f172a; }
    
    .status { text-align: center; font-size: 0.85rem; color: var(--accent); min-height: 20px; }
    label { font-size: 0.8rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    textarea { width: 100%; height: 120px; background: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 10px; color: var(--text); font-size: 0.9rem; resize: vertical; }
    .output-box { background: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 12px; min-height: 100px; font-size: 0.9rem; line-height: 1.5; white-space: pre-wrap; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Voice Notes & Summarizer</h1>
      <span id="badge" class="badge">Ready</span>
    </header>

    <!-- Recording Controls -->
    <div class="card">
      <div class="controls">
        <button id="startBtn" class="btn-start" onclick="startRecording()">🎤 Start Recording</button>
        <button id="stopBtn" class="btn-stop" onclick="stopRecording()" disabled>⏹ Stop Recording</button>
      </div>
      <div id="status" class="status">Tap Start Recording to begin.</div>
    </div>

    <!-- Transcript Box -->
    <div class="card">
      <label for="transcript">Recorded Speech / Notes</label>
      <textarea id="transcript" placeholder="Speak while recording, or type notes here..."></textarea>
      <button class="btn-action" onclick="generateSummary()">⚡ Summarize Notes</button>
    </div>

    <!-- Summary Box -->
    <div class="card">
      <label>Structured Summary</label>
      <div id="summary" class="output-box">Your generated summary, takeaways, and action items will appear here.</div>
    </div>
  </div>

  <script>
    let recognition;
    let isRecording = false;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      recognition.onresult = (event) => {
        let text = '';
        for (let i = 0; i < event.results.length; i++) {
          text += event.results[i][0].transcript + ' ';
        }
        document.getElementById('transcript').value = text;
      };

      recognition.onerror = (e) => {
        document.getElementById('status').innerText = "Mic note: " + e.error;
      };
    }

    function startRecording() {
      if (!recognition) {
        alert("Web Speech API not available on this browser. You can type directly into the text box.");
        return;
      }
      isRecording = true;
      document.getElementById('transcript').value = '';
      document.getElementById('summary').innerText = 'Summary will generate when you stop...';
      
      try {
        recognition.start();
        document.getElementById('badge').innerText = "Recording";
        document.getElementById('badge').classList.add('active');
        document.getElementById('status').innerText = "🎙️ Listening... Speak clearly.";
        document.getElementById('startBtn').disabled = true;
        document.getElementById('stopBtn').disabled = false;
      } catch (err) {
        document.getElementById('status').innerText = "Error starting mic: " + err.message;
      }
    }

    function stopRecording() {
      if (recognition && isRecording) {
        isRecording = false;
        recognition.stop();
      }
      document.getElementById('badge').innerText = "Ready";
      document.getElementById('badge').classList.remove('active');
      document.getElementById('status').innerText = "Recording stopped.";
      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;

      generateSummary();
    }

    function generateSummary() {
      const text = document.getElementById('transcript').value.trim();
      const summaryBox = document.getElementById('summary');

      if (!text) {
        summaryBox.innerText = "No text found to summarize.";
        return;
      }

      const sentences = text.match(/[^.!?]+[.!?]+/g) || [text];
      const overview = sentences.slice(0, 2).join(' ');
      const keyPoints = sentences.map((s, i) => `• Takeaway ${i + 1}: ${s.trim()}`).slice(0, 3).join('\n');

      summaryBox.innerText = 
        `📌 EXECUTIVE OVERVIEW:\n${overview}\n\n` +
        `💡 KEY TAKEAWAYS:\n${keyPoints}\n\n` +
        `✅ ACTION ITEMS:\n• Review session notes and share updates.`;
    }
  </script>
</body>
</html>
