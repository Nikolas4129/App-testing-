<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Notes & AI Summarizer</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .status-badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 12px;
      background: #334155;
      color: var(--text-sub);
    }

    .status-badge.recording {
      background: #7f1d1d;
      color: #fca5a5;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .controls {
      display: flex;
      gap: 12px;
    }

    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-start {
      background: #16a34a;
      color: white;
    }

    .btn-start:hover {
      background: #15803d;
    }

    .btn-stop {
      background: var(--danger);
      color: white;
    }

    .btn-stop:hover {
      background: var(--danger-hover);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status-text {
      font-size: 0.85rem;
      color: var(--accent);
      min-height: 20px;
      text-align: center;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    textarea {
      width: 100%;
      height: 150px;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      color: var(--text-main);
      font-size: 0.95rem;
      resize: vertical;
      line-height: 1.4;
    }

    textarea:focus {
      outline: 1px solid var(--accent);
    }

    .summary-box {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      min-height: 100px;
      font-size: 0.95rem;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .api-section {
      display: flex;
      gap: 8px;
    }

    .api-section input {
      flex: 1;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--text-main);
      font-size: 0.85rem;
    }

    .btn-sec {
      background: #334155;
      color: var(--text-main);
      font-size: 0.85rem;
      padding: 8px 12px;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Voice Notes & AI Summarizer</h1>
      <span id="badge" class="status-badge">Ready</span>
    </header>

    <!-- Recording Controls -->
    <div class="card">
      <div class="controls">
        <button id="startBtn" class="btn-start" onclick="startRecording()">
          <span>🎤</span> Start Recording
        </button>
        <button id="stopBtn" class="btn-stop" onclick="stopRecording()" disabled>
          <span>⏹</span> Stop Recording
        </button>
      </div>
      <div id="statusMsg" class="status-text">Tap "Start Recording" and grant microphone access.</div>
    </div>

    <!-- Live Transcript Box -->
    <div class="card">
      <label for="transcript">Live Transcript</label>
      <textarea id="transcript" placeholder="Your spoken words will appear here in real time..."></textarea>
      <button class="btn-sec" onclick="summarizeTranscript()">⚡ Summarize Transcript</button>
    </div>

    <!-- Summary Box -->
    <div class="card">
      <label>AI Summary</label>
      <div id="summary" class="summary-box">Summary will appear here after recording stops or when you click "Summarize Transcript".</div>
    </div>

    <!-- Optional API Key Settings -->
    <div class="card">
      <label for="apiKey">Gemini API Key (Optional for Live AI)</label>
      <div class="api-section">
        <input type="password" id="apiKey" placeholder="Enter Gemini API Key..." onchange="saveApiKey()">
        <button class="btn-sec" style="flex: 0 0 auto;" onclick="saveApiKey()">Save Key</button>
      </div>
    </div>
  </div>

  <script>
    let recognition = null;
    let isRecording = false;
    let fullTranscript = '';

    // Initialize Web Speech API
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      document.getElementById('statusMsg').innerText = "⚠️ Web Speech API is not supported on this browser. Try Chrome on Android.";
      document.getElementById('startBtn').disabled = true;
    } else {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      recognition.onstart = () => {
        isRecording = true;
        document.getElementById('badge').innerText = "Recording";
        document.getElementById('badge').classList.add('recording');
        document.getElementById('statusMsg').innerText = "🎙️ Listening... Speak clearly into your phone microphone.";
        document.getElementById('startBtn').disabled = true;
        document.getElementById('stopBtn').disabled = false;
      };

      recognition.onresult = (event) => {
        let interimTranscript = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            fullTranscript += event.results[i][0].transcript + ' ';
          } else {
            interimTranscript += event.results[i][0].transcript;
          }
        }
        document.getElementById('transcript').value = fullTranscript + interimTranscript;
      };

      recognition.onerror = (event) => {
        console.error("Speech Error:", event.error);
        if (event.error === 'no-speech') {
          document.getElementById('statusMsg').innerText = "⚠️ No speech detected recently. Still listening...";
        } else if (event.error === 'not-allowed') {
          document.getElementById('statusMsg').innerText = "❌ Microphone permission blocked in Chrome settings.";
        } else {
          document.getElementById('statusMsg').innerText = "⚠️ Speech error: " + event.error;
        }
      };

      recognition.onend = () => {
        if (isRecording) {
          try {
            recognition.start();
          } catch (e) {
            console.log("Auto-restart prevented:", e);
          }
        } else {
          document.getElementById('badge').innerText = "Ready";
          document.getElementById('badge').classList.remove('recording');
          document.getElementById('statusMsg').innerText = "Stopped. Generating summary...";
          document.getElementById('startBtn').disabled = false;
          document.getElementById('stopBtn').disabled = true;
        }
      };
    }

    window.onload = () => {
      const savedKey = localStorage.getItem('gemini_api_key');
      if (savedKey) document.getElementById('apiKey').value = savedKey;
    };

    function saveApiKey() {
      const key = document.getElementById('apiKey').value.trim();
      localStorage.setItem('gemini_api_key', key);
      alert(key ? "API Key saved!" : "API Key cleared.");
    }

    function startRecording() {
      if (!recognition) return;
      fullTranscript = '';
      document.getElementById('transcript').value = '';
      document.getElementById('summary').innerText = 'Summary will appear here...';
      isRecording = true;
      try {
        recognition.start();
      } catch (e) {
        console.error("Start error:", e);
      }
    }

    function stopRecording() {
      if (!recognition) return;
      isRecording = false;
      recognition.stop();
      setTimeout(summarizeTranscript, 500);
    }

    async function summarizeTranscript() {
      const text = document.getElementById('transcript').value.trim();
      const summaryBox = document.getElementById('summary');
      const apiKey = localStorage.getItem('gemini_api_key') || document.getElementById('apiKey').value.trim();

      if (!text) {
        summaryBox.innerText = "No text found in the transcript to summarize.";
        return;
      }

      summaryBox.innerText = "Generating summary...";

      if (!apiKey) {
        summaryBox.innerText = "💡 [Offline Basic Summary]\n\n" +
          "• Key Transcript Excerpt:\n" + text.slice(0, 300) + (text.length > 300 ? "..." : "") + "\n\n" +
          "(Tip: Add a Gemini API key at the bottom for full AI Executive Summaries and Action Items!)";
        return;
      }

      const prompt = `Please summarize the following transcript into:\n1. Executive Summary\n2. Key Takeaways\n3. Action Items\n\nTranscript:\n"${text}"`;

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });

        const data = await res.json();
        const output = data.candidates?.[0]?.content?.parts?.[0]?.text;
        summaryBox.innerText = output || "Could not generate summary. Check your API key.";
      } catch (err) {
        summaryBox.innerText = "API Error: " + err.message;
      }
    }
  </script>
</body>
</html>
