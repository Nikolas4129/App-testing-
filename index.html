<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Notes & AI Summarizer</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --danger: #ef4444;
      --success: #22c55e;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
    .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 16px; }
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    h1 { font-size: 1.1rem; font-weight: 700; }
    .badge { font-size: 0.75rem; padding: 4px 8px; border-radius: 12px; background: var(--border); color: var(--muted); }
    .badge.active { background: #7f1d1d; color: #fca5a5; animation: blink 1.5s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .controls { display: flex; gap: 10px; }
    button { flex: 1; padding: 14px; border: none; border-radius: 8px; font-weight: 600; font-size: 0.95rem; cursor: pointer; color: white; display: flex; justify-content: center; align-items: center; gap: 8px; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-start { background: var(--success); }
    .btn-stop { background: var(--danger); }
    .btn-action { background: var(--accent); color: #0f172a; }
    
    .status { text-align: center; font-size: 0.85rem; color: var(--accent); min-height: 20px; }
    label { font-size: 0.8rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    textarea { width: 100%; height: 120px; background: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 10px; color: var(--text); font-size: 0.9rem; resize: vertical; }
    .output-box { background: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 12px; min-height: 100px; font-size: 0.9rem; line-height: 1.5; white-space: pre-wrap; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Voice Notes & Summarizer</h1>
      <span id="badge" class="badge">Ready</span>
    </header>

    <!-- Recording Controls -->
    <div class="card">
      <div class="controls">
        <button id="startBtn" class="btn-start" onclick="startRecording()">🎤 Start Recording</button>
        <button id="stopBtn" class="btn-stop" onclick="stopRecording()" disabled>⏹ Stop Recording</button>
      </div>
      <div id="status" class="status">Tap Start Recording to begin.</div>
    </div>

    <!-- Transcript Box -->
    <div class="card">
      <label for="transcript">Recorded Speech / Notes</label>
      <textarea id="transcript" placeholder="Speak while recording, or type notes here..."></textarea>
      <button class="btn-action" onclick="generateSummary()">⚡ Summarize Notes</button>
    </div>

    <!-- Summary Box -->
    <div class="card">
      <label>Structured Summary</label>
      <div id="summary" class="output-box">Your generated summary, takeaways, and action items will appear here.</div>
    </div>
  </div>

  <script>
    let recognition = null;
    let isRecording = false;
    let microphoneStream = null;
    let restartTimer = null;
    let finalTranscript = '';
    let interimTranscript = '';

    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const isAndroid = /Android/i.test(navigator.userAgent);
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    function setStatus(message, type = 'info') {
      const el = document.getElementById('status');
      el.innerText = message;
      el.style.color = type === 'error' ? '#fca5a5' : '#38bdf8';
    }

    function updateBadge(label, active = false) {
      const badge = document.getElementById('badge');
      badge.innerText = label;
      badge.classList.toggle('active', active);
    }

    function initRecognition() {
      if (!SpeechRecognition) return;

      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.lang = 'en-US';
      recognition.maxAlternatives = 1;

      recognition.onresult = (event) => {
        let newInterim = '';

        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript.trim();
          if (!transcript) continue;

          if (event.results[i].isFinal) {
            finalTranscript += transcript + ' ';
          } else {
            newInterim += transcript + ' ';
          }
        }

        interimTranscript = newInterim.trim();
        document.getElementById('transcript').value = (finalTranscript + ' ' + interimTranscript).trim();
      };

      recognition.onerror = (event) => {
        console.warn('Speech recognition error:', event.error);

        if (event.error === 'not-allowed') {
          setStatus('Microphone permission was denied. Please allow access and try again.', 'error');
          stopRecording(true);
          return;
        }

        if (event.error === 'no-speech') {
          setStatus('Listening... speak a little louder or closer to the mic.', 'info');
          return;
        }

        if (event.error === 'audio-capture') {
          setStatus('Could not access the microphone on this device.', 'error');
          stopRecording(true);
          return;
        }

        if (event.error === 'network') {
          setStatus('Network issue while listening. Please try again.', 'error');
          stopRecording(true);
          return;
        }
      };

      recognition.onend = () => {
        if (!isRecording) return;

        clearTimeout(restartTimer);
        restartTimer = setTimeout(() => {
          try {
            recognition.start();
          } catch (err) {
            console.log('Restart blocked:', err.message);
          }
        }, isIOS ? 250 : 120);
      };
    }

    function resetTranscriptState() {
      finalTranscript = '';
      interimTranscript = '';
      document.getElementById('transcript').value = '';
    }

    async function startRecording() {
      if (!recognition) {
        alert('Web Speech API not available on this browser. You can type directly into the text box.');
        return;
      }

      if (isRecording) return;

      try {
        microphoneStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          },
          video: false
        });
      } catch (err) {
        setStatus('Microphone permission denied or unavailable on this device.', 'error');
        return;
      }

      isRecording = true;
      resetTranscriptState();
      document.getElementById('summary').innerText = 'Summary will generate when you stop...';

      try {
        recognition.start();
      } catch (err) {
        console.log('Start already in progress:', err.message);
      }

      updateBadge('Recording', true);
      setStatus(isAndroid ? '🎙️ Listening... Speak clearly into the mic.' : '🎙️ Listening... Speak clearly and keep the phone near your mouth.');
      document.getElementById('startBtn').disabled = true;
      document.getElementById('stopBtn').disabled = false;
    }

    function stopRecording(force = false) {
      if (!force && !isRecording) return;
      isRecording = false;

      if (recognition) {
        try {
          recognition.stop();
        } catch (err) {
          console.log('Stop recognition ignored:', err.message);
        }
      }

      if (microphoneStream) {
        microphoneStream.getTracks().forEach(track => track.stop());
        microphoneStream = null;
      }

      clearTimeout(restartTimer);
      updateBadge('Ready', false);
      setStatus('Recording stopped.', 'info');
      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;

      if (!force) {
        generateSummary();
      }
    }

    function generateSummary() {
      const text = document.getElementById('transcript').value.trim();
      const summaryBox = document.getElementById('summary');

      if (!text) {
        summaryBox.innerText = 'No text found to summarize.';
        return;
      }

      const sentences = text.match(/[^.!?]+[.!?]+/g) || [text];
      const overview = sentences.slice(0, 2).join(' ');
      const keyPoints = sentences.map((s, i) => `• Takeaway ${i + 1}: ${s.trim()}`).slice(0, 3).join('\n');

      summaryBox.innerText =
        `📌 EXECUTIVE OVERVIEW:\n${overview}\n\n` +
        `💡 KEY TAKEAWAYS:\n${keyPoints}\n\n` +
        `✅ ACTION ITEMS:\n• Review session notes and share updates.`;
    }

    initRecognition();
  </script>
</body>
</html>
