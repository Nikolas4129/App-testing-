<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thought Capture & Summary</title>
  <style>
    :root {
      --bg: #08111f;
      --panel: #111c2e;
      --panel-2: #16253d;
      --text: #edf2ff;
      --muted: #9fb3d1;
      --accent: #5eead4;
      --accent-2: #7c9cff;
      --danger: #f87171;
      --success: #34d399;
      --border: rgba(148, 163, 184, 0.2);
      --shadow: 0 24px 60px rgba(15, 23, 42, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Inter, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #08111f 0%, #0d172b 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .app {
      width: min(100%, 900px);
      display: grid;
      grid-template-columns: 1.1fr 1.2fr;
      gap: 18px;
    }

    .card {
      background: rgba(17, 28, 46, 0.92);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 20px;
    }

    .left-col, .right-col {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: clamp(1.4rem, 2vw, 2rem);
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 100px;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text);
      background: rgba(93, 124, 182, 0.18);
      border: 1px solid rgba(148, 163, 184, 0.25);
    }

    .pill.recording {
      background: rgba(248, 113, 113, 0.14);
      border-color: rgba(248, 113, 113, 0.3);
      color: #fecaca;
    }

    .controls {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 13px 18px;
      font-weight: 700;
      font-size: 0.96rem;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
      color: white;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }

    .primary {
      background: linear-gradient(135deg, var(--success), #10b981);
    }

    .secondary {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }

    .danger {
      background: linear-gradient(135deg, var(--danger), #ef4444);
    }

    .muted {
      background: rgba(148, 163, 184, 0.08);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .status {
      min-height: 24px;
      font-size: 0.92rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .notice {
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.5;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(148, 163, 184, 0.06);
      border: 1px solid var(--border);
    }

    textarea {
      width: 100%;
      min-height: 260px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(8, 17, 31, 0.9);
      color: var(--text);
      padding: 16px;
      font-size: 0.98rem;
      line-height: 1.6;
    }

    textarea:focus {
      outline: none;
      border-color: rgba(94, 234, 212, 0.55);
      box-shadow: 0 0 0 3px rgba(94, 234, 212, 0.12);
    }

    .summary-box {
      min-height: 280px;
      background: rgba(8, 17, 31, 0.9);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 16px;
      white-space: pre-wrap;
      line-height: 1.7;
      color: var(--text);
      font-size: 0.96rem;
    }

    .sample-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .sample-btn {
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(148, 163, 184, 0.08);
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 600;
    }

    @media (max-width: 760px) {
      .app {
        grid-template-columns: 1fr;
      }

      .controls {
        flex-direction: column;
      }

      .controls button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="left-col">
      <div class="card">
        <div class="header">
          <h1>Thought Capture</h1>
          <div id="statusPill" class="pill">Ready</div>
        </div>

        <div class="controls">
          <button id="startBtn" class="primary" onclick="startListening()">🎙️ Start Listening</button>
          <button id="stopBtn" class="danger" onclick="stopListening()" disabled>⏹ Stop Listening</button>
        </div>

        <div id="statusText" class="status">Press start listening, speak your thoughts, then press stop.</div>
        <div class="notice">Works best in Chrome or Edge. If speech recognition is unavailable, you can type your thoughts manually.</div>
      </div>

      <div class="card">
        <div class="sample-row">
          <button class="sample-btn" onclick="loadSample('idea')">Idea</button>
          <button class="sample-btn" onclick="loadSample('meeting')">Meeting</button>
          <button class="sample-btn" onclick="loadSample('brainstorm')">Brainstorm</button>
        </div>

        <textarea id="transcript" placeholder="Your spoken words will appear here after you stop listening, or type notes manually here..."></textarea>

        <div class="controls">
          <button class="secondary" onclick="generateSummary()">✨ Summarize</button>
          <button class="muted" onclick="clearTranscript()">Clear</button>
        </div>
      </div>
    </div>

    <div class="right-col">
      <div class="card">
        <div class="header">
          <h1>Summary</h1>
        </div>
        <div id="summaryBox" class="summary-box">Your concise recap will appear here after the transcript is created.</div>
      </div>
    </div>
  </div>

  <script>
    const statusPill = document.getElementById('statusPill');
    const statusText = document.getElementById('statusText');
    const transcriptInput = document.getElementById('transcript');
    const summaryBox = document.getElementById('summaryBox');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');

    let recognition = null;
    let isListening = false;
    let finalTranscript = '';
    let interimTranscript = '';

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    const samples = {
      idea: "I want to build a personal note app that captures thoughts quickly and turns them into concise summaries. The system should make it easy to record an idea, review it later, and turn it into action items without much effort.",
      meeting: "The team agreed to focus on one project this week. We need to finalize the user flow and confirm the launch checklist. Everyone will share status updates in the next standup and we should review the blockers before Friday.",
      brainstorm: "We should think bigger about the product. A simple note capture feature with summaries and follow-up tasks could be very useful for busy people. The main win is saving time and turning raw thoughts into a clear plan without manual effort."
    };

    function setStatus(message, recording = false) {
      statusText.textContent = message;
      statusPill.textContent = recording ? 'Listening' : 'Ready';
      statusPill.classList.toggle('recording', recording);
    }

    function initSpeechRecognition() {
      if (!SpeechRecognition) {
        setStatus('Speech recognition is not supported in this browser. You can still type your thoughts manually.', false);
        return;
      }

      recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.maxAlternatives = 1;

      recognition.onresult = (event) => {
        let interim = '';

        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript.trim();
          if (!transcript) continue;

          if (event.results[i].isFinal) {
            finalTranscript += transcript + ' ';
          } else {
            interim += transcript + ' ';
          }
        }

        interimTranscript = interim.trim();
        transcriptInput.value = (finalTranscript + ' ' + interimTranscript).trim();
      };

      recognition.onerror = (event) => {
        console.warn('Speech recognition issue:', event.error);
        if (event.error === 'not-allowed') {
          setStatus('Microphone permission was denied. Please allow access and try again.', false);
          stopListening(false);
          return;
        }

        if (event.error === 'no-speech') {
          setStatus('No speech detected. Try again and speak clearly.', false);
          stopListening(false);
          return;
        }

        setStatus('There was a problem listening. Please try again.', false);
        stopListening(false);
      };

      recognition.onend = () => {
        if (isListening) {
          try {
            recognition.start();
          } catch (err) {
            console.log('Speech engine restart blocked:', err.message);
          }
        }
      };
    }

    function startListening() {
      if (!recognition) {
        initSpeechRecognition();
      }

      if (!recognition) {
        setStatus('Speech recognition is unavailable here. Type your thoughts manually instead.', false);
        return;
      }

      if (isListening) return;

      isListening = true;
      finalTranscript = transcriptInput.value ? transcriptInput.value.trim() + ' ' : '';
      interimTranscript = '';
      startBtn.disabled = true;
      stopBtn.disabled = false;
      setStatus('Listening... speak your thoughts clearly.', true);

      try {
        recognition.start();
      } catch (err) {
        console.log('Already started:', err.message);
      }
    }

    function stopListening(shouldGenerate = true) {
      if (!isListening && !recognition) return;

      isListening = false;

      if (recognition) {
        try {
          recognition.stop();
        } catch (err) {
          console.log('Speech stop ignored:', err.message);
        }
      }

      startBtn.disabled = false;
      stopBtn.disabled = true;
      setStatus('Listening stopped. Your transcript is ready to review.', false);

      if (shouldGenerate) {
        generateSummary();
      }
    }

    function clearTranscript() {
      transcriptInput.value = '';
      finalTranscript = '';
      interimTranscript = '';
      summaryBox.textContent = 'Your concise recap will appear here after the transcript is created.';
      setStatus('Transcript cleared.', false);
    }

    function loadSample(type) {
      transcriptInput.value = samples[type] || samples.idea;
      finalTranscript = transcriptInput.value;
      interimTranscript = '';
      setStatus('Sample thoughts loaded.', false);
    }

    function generateSummary() {
      const text = transcriptInput.value.trim();

      if (!text) {
        summaryBox.textContent = 'No thoughts captured yet. Start listening or type notes first.';
        return;
      }

      const cleaned = text.replace(/\s+/g, ' ').trim();
      const sentences = cleaned.match(/[^.!?]+[.!?]+/g) || [cleaned];

      const overview = sentences.slice(0, 2).join(' ').trim();
      const keyIdeas = sentences
        .filter(sentence => sentence.trim().length > 18)
        .slice(0, 4)
        .map((sentence, index) => `${index + 1}. ${sentence.trim()}`)
        .join('\n');

      const actionItems = [];
      sentences.forEach(sentence => {
        const lower = sentence.toLowerCase();
        if (
          lower.includes('need') ||
          lower.includes('must') ||
          lower.includes('should') ||
          lower.includes('will') ||
          lower.includes('review') ||
          lower.includes('follow up') ||
          lower.includes('next') ||
          lower.includes('tomorrow') ||
          lower.includes('today') ||
          lower.includes('fix')
        ) {
          actionItems.push(sentence.trim());
        }
      });

      const finalActions = actionItems.length ? actionItems.slice(0, 3) : ['Review the notes and decide the next concrete action.'];

      summaryBox.textContent =
        `THOUGHT OVERVIEW\n${overview || 'This note captures the main idea and direction of the conversation.'}\n\n` +
        `KEY TAKEAWAYS\n${keyIdeas || '1. The core idea is clearly captured in the transcript.'}\n\n` +
        `ACTION ITEMS\n${finalActions.map((item, idx) => `${idx + 1}. ${item}`).join('\n')}`;
    }

    initSpeechRecognition();
  </script>
</body>
</html>
