<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice Notes & AI Summarizer</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --danger: #ef4444;
      --success: #22c55e;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
    .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 16px; }
    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    h1 { font-size: 1.1rem; font-weight: 700; }
    .badge { font-size: 0.75rem; padding: 4px 8px; border-radius: 12px; background: var(--border); color: var(--muted); }
    .badge.active { background: #7f1d1d; color: #fca5a5; animation: blink 1.5s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .controls { display: flex; gap: 10px; }
    button { flex: 1; padding: 14px; border: none; border-radius: 8px; font-weight: 600; font-size: 0.95rem; cursor: pointer; color: white; display: flex; justify-content: center; align-items: center; gap: 8px; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-start { background: var(--success); }
    .btn-stop { background: var(--danger); }
    .btn-action { background: var(--accent); color: #0f172a; }
    
    .status { text-align: center; font-size: 0.85rem; color: var(--accent); min-height: 20px; }
    label { font-size: 0.8rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
    textarea { width: 100%; height: 120px; background: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 10px; color: var(--text); font-size: 0.9rem; resize: vertical; }
    .output-box { background: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 12px; min-height: 100px; font-size: 0.9rem; line-height: 1.5; white-space: pre-wrap; }
    
    input[type="password"] { width: 100%; background: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 10px; color: var(--text); font-size: 0.85rem; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Voice Notes & AI Summarizer</h1>
      <span id="badge" class="badge">Ready</span>
    </header>

    <!-- Recording Controls -->
    <div class="card">
      <div class="controls">
        <button id="startBtn" class="btn-start" onclick="startRecording()">🎤 Start Recording</button>
        <button id="stopBtn" class="btn-stop" onclick="stopRecording()" disabled>⏹ Stop Recording</button>
      </div>
      <div id="status" class="status">Tap Start Recording to capture audio.</div>
    </div>

    <!-- API Key Input -->
    <div class="card">
      <label for="apiKey">Gemini API Key (Required for Multimodal Transcription)</label>
      <input type="password" id="apiKey" placeholder="AIzaSy..." onchange="saveKey()">
    </div>

    <!-- Transcript Box -->
    <div class="card">
      <label for="transcript">Transcript / Spoken Content</label>
      <textarea id="transcript" placeholder="Transcribed audio will appear here..."></textarea>
    </div>

    <!-- Summary Box -->
    <div class="card">
      <label>AI Structured Summary</label>
      <div id="summary" class="output-box">Your summary (Executive Summary, Key Takeaways, Action Items) will generate here after recording stops.</div>
    </div>
  </div>

  <script>
    let mediaRecorder;
    let audioChunks = [];

    window.onload = () => {
      const savedKey = localStorage.getItem('gemini_api_key');
      if (savedKey) document.getElementById('apiKey').value = savedKey;
    };

    function saveKey() {
      const key = document.getElementById('apiKey').value.trim();
      localStorage.setItem('gemini_api_key', key);
    }

    async function startRecording() {
      const key = document.getElementById('apiKey').value.trim() || localStorage.getItem('gemini_api_key');
      if (!key) {
        alert("Please enter a valid Gemini API Key first!");
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks = [];
        mediaRecorder = new MediaRecorder(stream);

        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) audioChunks.push(event.data);
        };

        mediaRecorder.onstop = processAudioWithGemini;

        mediaRecorder.start();
        document.getElementById('badge').innerText = "Recording";
        document.getElementById('badge').classList.add('active');
        document.getElementById('status').innerText = "🎙️ Recording audio stream... Speak into your microphone.";
        document.getElementById('startBtn').disabled = true;
        document.getElementById('stopBtn').disabled = false;
      } catch (err) {
        document.getElementById('status').innerText = "❌ Mic Permission Error: " + err.message;
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
        // Stop audio track release
        mediaRecorder.stream.getTracks().forEach(track => track.stop());
      }
      document.getElementById('badge').innerText = "Processing";
      document.getElementById('badge').classList.remove('active');
      document.getElementById('status').innerText = "⏳ Uploading audio to Gemini AI for transcription & summarization...";
      document.getElementById('startBtn').disabled = false;
      document.getElementById('stopBtn').disabled = true;
    }

    async function processAudioWithGemini() {
      const apiKey = document.getElementById('apiKey').value.trim() || localStorage.getItem('gemini_api_key');
      const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });

      // Convert Audio Blob to Base64
      const reader = new FileReader();
      reader.readAsDataURL(audioBlob);
      reader.onloadend = async () => {
        const base64Audio = reader.result.split(',')[1];

        const promptText = 
          "Analyze the attached audio recording and respond in strictly two distinct formatted sections:\n\n" +
          "SECTION 1: TRANSCRIPT\n" +
          "Provide a full word-for-word verbatim transcription of what was spoken in the audio.\n\n" +
          "SECTION 2: SUMMARY\n" +
          "Provide a structured summary formatted as follows:\n" +
          "• Executive Summary (2-3 sentences)\n" +
          "• Key Takeaways\n" +
          "• Action Items / Next Steps";

        try {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [
                  { text: promptText },
                  { inline_data: { mime_type: "audio/webm", data: base64Audio } }
                ]
              }]
            })
          });

          const data = await response.json();
          if (data.error) {
            document.getElementById('status').innerText = "❌ API Error: " + data.error.message;
            return;
          }

          const rawOutput = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
          
          // Split verbatim transcript and summary sections
          if (rawOutput.includes("SECTION 2: SUMMARY")) {
            const parts = rawOutput.split("SECTION 2: SUMMARY");
            document.getElementById('transcript').value = parts[0].replace("SECTION 1: TRANSCRIPT", "").trim();
            document.getElementById('summary').innerText = parts[1].trim();
          } else {
            document.getElementById('transcript').value = rawOutput;
            document.getElementById('summary').innerText = "Summary section generated above.";
          }

          document.getElementById('status').innerText = "✅ Complete! Audio transcribed and summarized.";
        } catch (err) {
          document.getElementById('status').innerText = "❌ Error processing audio: " + err.message;
        }
      };
    }
  </script>
</body>
</html>
